<h1>My Orders</h1>

{% for order in orders %}
    <div>
        <h3>Order #{{ order.id }}</h3>
        <p>Date: {{ order.created_at }}</p>
        <p>Status: {{ order.status }}</p>
        {% for item in order.items.all %}
            <p>{{ item.product.name }} x {{ item.quantity }}</p>
        {% endfor %}
    </div>
{% empty %}
    <p>You have no orders</p>
{% endfor %}
